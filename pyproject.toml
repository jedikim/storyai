[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storyai"
version = "0.8.1"
description = "A narrative knowledge graph and MCP server for long-form fiction continuity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "fastmcp>=2,<5",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "sqlite-vec==0.1.9",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
storyai-load-bible = "server.load_bible:main"
storyai-consolidate = "server.consolidate:main"
storyai-cascade = "server.cascade_worker:main"
storyai-server = "server.app:main"
storyai-ui = "server.ui:main"

[tool.setuptools.packages.find]
include = ["server*", "storyai*"]

[tool.setuptools.package-data]
server = ["static/index.html", "static/assets/*"]

[tool.setuptools.data-files]
"spec" = [
  "spec/ontology.json",
  "spec/policy.json",
  "spec/rules.json",
  "spec/schema.sql",
  "spec/tools.json",
]
"prompts/v1" = [
  "prompts/v1/README.md",
  "prompts/v1/entity.md",
  "prompts/v1/fact.md",
  "prompts/v1/manifest.schema.json",
  "prompts/v1/scene.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
